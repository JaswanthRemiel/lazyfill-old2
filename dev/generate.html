<!doctype html>
<html><head><meta charset="utf-8" /><title>generate card</title>
<style>body{margin:0;background:#f5f5f7;font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#111113}
main{max-width:640px;margin:0 auto;padding:40px 20px}.card{background:#fff;border:1px solid #e5e5ea;border-radius:16px;padding:28px}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}.sub{margin:0 0 24px;color:#6e6e73}label{display:block;font-weight:600;font-size:13px;margin:16px 0 6px}
input,textarea{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d2d2d7;border-radius:10px;font:inherit}textarea{min-height:110px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}</style></head>
<body><main><div class="card"><h1>Staff Engineer</h1><p class="sub">Acme Robotics &middot; Remote</p>
<div class="row"><div><label>First name</label><input value="Ada"></div><div><label>Last name</label><input value="Lovelace"></div></div>
<label>Email</label><input value="ada@example.com">
<label id="q">Why do you want to work at Acme Robotics?</label><textarea id="why"></textarea></div></main>
<script type="module" src="/dev/generate-entry.ts"></script></body></html>
