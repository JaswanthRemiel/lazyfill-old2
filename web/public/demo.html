<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply: Staff Engineer at Acme Robotics (demo)</title>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Staff Engineer","hiringOrganization":{"@type":"Organization","name":"Acme Robotics"},"description":"Build the software that drives our warehouse robots.","jobLocation":{"@type":"Place","address":{"addressLocality":"Remote"}}}</script>
<style>
:root{color-scheme:light dark}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;background:#f5f5f7;color:#111113}
@media (prefers-color-scheme:dark){body{background:#000;color:#f5f5f7}input,textarea,select{background:#1c1c1e!important;color:#f5f5f7!important;border-color:#3a3a3c!important}.card{background:#0b0b0c!important;border-color:#2c2c2e!important}}
main{max-width:640px;margin:0 auto;padding:40px 20px 80px}
.card{background:#fff;border:1px solid #e5e5ea;border-radius:16px;padding:28px}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}.sub{margin:0 0 24px;color:#6e6e73}
label{display:block;font-weight:600;font-size:13px;margin:16px 0 6px}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d2d2d7;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{margin-top:24px;padding:12px 22px;border:0;border-radius:999px;background:#111113;color:#fff;font:inherit;font-weight:600}
.note{margin-top:18px;font-size:12.5px;color:#6e6e73}
</style>
</head>
<body>
<main>
<div class="card">
<h1>Staff Engineer</h1>
<p class="sub">Acme Robotics &middot; Remote &middot; This is a demo page for trying lazyfill. Nothing you enter here is sent anywhere.</p>
<form onsubmit="return false">
<div class="row">
<div><label for="first_name">First name</label><input id="first_name" name="first_name" autocomplete="given-name"></div>
<div><label for="last_name">Last name</label><input id="last_name" name="last_name" autocomplete="family-name"></div>
</div>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email">
<label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel">
<div class="row">
<div><label for="city">City</label><input id="city" name="city" autocomplete="address-level2"></div>
<div><label for="country">Country</label><input id="country" name="country" autocomplete="country-name"></div>
</div>
<label for="linkedin">LinkedIn profile</label><input id="linkedin" name="linkedin">
<label for="github">GitHub</label><input id="github" name="github">
<label for="website">Website</label><input id="website" name="website">
<label for="company">Current company</label><input id="company" name="company">
<label for="resume">Resume</label><input id="resume" name="resume" type="file">
<label for="why">Why do you want to work at Acme Robotics?</label><textarea id="why" name="why"></textarea>
<button type="button">Submit application</button>
<p class="note">Select the question above, right-click, and choose &ldquo;Generate with lazyfill&rdquo; to try AI-written answers (needs your own API key).</p>
</form>
</div>
</main>
</body>
</html>
